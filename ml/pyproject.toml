[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surgtrack-educational"
version = "0.2.0"
description = "Nonclinical surgical video perception learning baseline"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24,<2", "Pillow>=9"]

[project.optional-dependencies]
dev = ["pytest>=7"]
export = ["onnx>=1.14,<1.17", "onnxruntime>=1.16,<1.20"]
video = ["opencv-python>=4.8,<4.12"]

[project.scripts]
surgtrack = "surgtrack.cli:main"
surgtrack-motion = "surgtrack.milestone2:main"

[tool.setuptools.packages.find]
include = ["surgtrack*"]
